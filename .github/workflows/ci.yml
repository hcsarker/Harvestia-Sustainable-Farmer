name: CI/CD Pipeline

on:
  push:
    branches: [HCS]
  pull_request:
    branches: [HCS]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run tests (if available)
        run: npm test || echo "Tests failed or not available, continuing build..."
        continue-on-error: true
